[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cybercheck"
version = "0.1.0"
description = "Local, low-impact domain security configuration assessments"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
  "dnspython>=2.7,<3",
  "httpx>=0.28,<1",
  "httpcore>=1.0.9,<2",
  "idna>=3.10,<4",
  "streamlit>=1.45,<2",
  "jinja2>=3.1.6,<4",
  "tldextract>=5.1,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[project.scripts]
cybercheck = "cybercheck.cli:main"

[tool.setuptools.packages.find]
include = ["cybercheck*"]

[tool.setuptools.package-data]
"cybercheck.reports" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
